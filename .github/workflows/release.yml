name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Installer tools, pinned (packaging/ holds the files they build from).
  WIX_VERSION: "5.0.2"
  # The AppImage tools are downloaded per architecture (`-<arch>` appended to the URLs).
  APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool
  APPIMAGETOOL_SHA256_x86_64: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
  APPIMAGETOOL_SHA256_aarch64: f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
  APPIMAGE_RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime
  APPIMAGE_RUNTIME_SHA256_x86_64: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
  APPIMAGE_RUNTIME_SHA256_aarch64: 00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          # The oldest Ubuntu LTS still in standard support: Linux binaries need
          # at least the glibc they were built with.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            arch: x86_64
            deb_arch: amd64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            arch: aarch64
            deb_arch: arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked -p cc_app -p cc_cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="constructcraft-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp README.md README.pt-BR.md LICENSE CHANGELOG.md "dist/$name/"
          cp examples/casa_simples.ccad "dist/$name/"
          if [ "${{ matrix.archive }}" = zip ]; then
            cp "target/${{ matrix.target }}/release/constructcraft.exe" "target/${{ matrix.target }}/release/ccad.exe" "dist/$name/"
            (cd dist && 7z a "$name.zip" "$name" > /dev/null)
          else
            cp "target/${{ matrix.target }}/release/constructcraft" "target/${{ matrix.target }}/release/ccad" "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi
          rm -rf "dist/$name"

      # Windows: MSI (WiX v5), per-machine, with an optional PATH entry for ccad.
      - name: Install WiX
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dotnet tool install --global wix --version "$WIX_VERSION"
          echo "$USERPROFILE\\.dotnet\\tools" >> "$GITHUB_PATH"
          "$USERPROFILE/.dotnet/tools/wix" extension add --global "WixToolset.UI.wixext/$WIX_VERSION"
      - name: MSI installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          wix --version
          version="${GITHUB_REF_NAME#v}"
          python packaging/windows/license_rtf.py LICENSE "$RUNNER_TEMP/License.rtf"
          wix build packaging/windows/constructcraft.wxs -arch x64 -ext WixToolset.UI.wixext \
            -d "Version=${version%%[-+]*}" \
            -d "BinDir=target/${{ matrix.target }}/release" \
            -d "LicenseRtf=$RUNNER_TEMP/License.rtf" \
            -o "dist/constructcraft-${GITHUB_REF_NAME}-x86_64.msi"

      # Windows code signing (SignPath Foundation). One signing request takes the portable
      # .zip and the .msi; SignPath signs constructcraft.exe and ccad.exe inside both, then
      # the .msi itself (packaging/windows/signpath-artifact-configuration.xml), and the
      # signed files replace the unsigned ones in dist/. Configured by the repository
      # variables SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG and
      # SIGNPATH_SIGNING_POLICY_SLUG (and SIGNPATH_ARTIFACT_CONFIGURATION_SLUG, when not the
      # project's default) and the secret SIGNPATH_API_TOKEN; without them (forks) the
      # release is built unsigned, with a warning.
      - name: Upload unsigned Windows files
        id: unsigned
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.msi
      - name: Sign with SignPath
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # Release signing waits for a manual approval in SignPath.
          wait-for-completion-timeout-in-seconds: 14400
          output-artifact-directory: signed
      - name: Replace with the signed files
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          Get-ChildItem signed
          foreach ($f in Get-ChildItem dist -Include *.zip, *.msi -File -Recurse) {
            $signed = Join-Path signed $f.Name
            if (-not (Test-Path -LiteralPath $signed)) { throw "SignPath returned no $($f.Name)" }
            Copy-Item -LiteralPath $signed -Destination $f.FullName -Force
          }
          $msi = Get-ChildItem dist -Filter *.msi -File | Select-Object -First 1
          $exes = Join-Path $env:RUNNER_TEMP signed-zip
          Get-ChildItem dist -Filter *.zip -File | ForEach-Object { Expand-Archive -LiteralPath $_.FullName -DestinationPath $exes }
          foreach ($file in @($msi) + @(Get-ChildItem $exes -Filter *.exe -File -Recurse)) {
            $s = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($s.Status -ne 'Valid') { throw "$($file.Name): signature $($s.Status)" }
            "$($file.Name): $($s.SignerCertificate.Subject)"
          }
      - name: Unsigned Windows build
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID == ''
        shell: bash
        run: echo "::warning::SIGNPATH_ORGANIZATION_ID is not set; the Windows files are not code-signed"

      # Linux: .deb (dpkg-deb) and AppImage (appimagetool), built natively on each architecture.
      - name: Linux packaging tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Retries, and other mirrors when the runner's cannot be reached.
          packaging/linux/apt-install.sh dpkg-dev desktop-file-utils \
            patchelf libxkbcommon0 libxkbcommon-x11-0 libxcb-xkb1 libxcursor1 libxi6
          desktop-file-validate packaging/linux/constructcraft.desktop
          arch=${{ matrix.arch }}
          tool_sha="APPIMAGETOOL_SHA256_$arch"
          runtime_sha="APPIMAGE_RUNTIME_SHA256_$arch"
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" "$APPIMAGETOOL_URL-$arch.AppImage"
          curl -fsSL -o "$RUNNER_TEMP/runtime-$arch" "$APPIMAGE_RUNTIME_URL-$arch"
          echo "${!tool_sha}  $RUNNER_TEMP/appimagetool" | sha256sum -c -
          echo "${!runtime_sha}  $RUNNER_TEMP/runtime-$arch" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/appimagetool"
      - name: Debian package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          packaging/linux/build-deb.sh "$version" "target/${{ matrix.target }}/release" ${{ matrix.deb_arch }} \
            "dist/constructcraft_${version//-/\~}_${{ matrix.deb_arch }}.deb"
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
      - name: AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          packaging/linux/build-appimage.sh "target/${{ matrix.target }}/release" ${{ matrix.arch }} \
            "dist/constructcraft-${GITHUB_REF_NAME}-${{ matrix.arch }}.AppImage" \
            "$RUNNER_TEMP/appimagetool" "$RUNNER_TEMP/runtime-${{ matrix.arch }}"

      # macOS: ConstructCraft.app in a .dmg, one per architecture (ccad stays in the archive).
      - name: DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          packaging/macos/build-dmg.sh "${GITHUB_REF_NAME#v}" "target/${{ matrix.target }}/release/constructcraft" \
            "dist/constructcraft-${GITHUB_REF_NAME}-${{ matrix.target }}.dmg"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.msi
            dist/*.deb
            dist/*.AppImage
            dist/*.dmg

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
      # The installers again under names without the version, so that
      # releases/latest/download/<name> always gives the newest (the README links them).
      - name: Fixed-name copies
        run: |
          cd dist
          for f in *.msi *.dmg *.AppImage *.deb; do
            if [ ! -e "$f" ]; then
              echo "::error::no file matches $f"
              exit 1
            fi
            case "$f" in
              *.deb) fixed="constructcraft_${f##*_}" ;;
              *) fixed="${f/-$GITHUB_REF_NAME/}" ;;
            esac
            if [ "$fixed" = "$f" ]; then
              echo "::error::$f has no version to leave out"
              exit 1
            fi
            cp -- "$f" "$fixed"
          done
          ls -l
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "ConstructCraft $GITHUB_REF_NAME" --notes-file notes.md
